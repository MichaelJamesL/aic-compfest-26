services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aic26-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aic26
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aic26"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: