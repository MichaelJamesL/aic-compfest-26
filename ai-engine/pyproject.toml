[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "src"
version = "0.1.0"
description = "Predictive-maintenance AI pipeline for AIC Compfest"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai[openai]>=0.1",
    "pydantic>=2.7",
    "numpy>=1.24",
    "fastembed>=0.3",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "tiktoken>=0.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vision = ["anomalib>=2.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]