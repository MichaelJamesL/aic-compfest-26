services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aic26-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aic26
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aic26"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The frontend. Serves the built SPA and proxies /api, /config and /health
  # to the backend service, which does not exist yet — see
  # docs/requirements/BACKEND.md §7 (B6). Until it does, `web` starts and
  # serves the UI, but every request to the API returns 502.
  web:
    build:
      context: ./frontend
    container_name: aic26-web
    ports:
      - "5173:80"
    depends_on:
      - db

volumes:
  db_data: